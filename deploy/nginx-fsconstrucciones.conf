# Plantilla del sitio nginx. setup.sh reemplaza __DOMAIN__ y la instala en
# /etc/nginx/sites-available/fsconstrucciones. certbot agrega luego el bloque 443
# y la redireccion HTTP -> HTTPS.

limit_req_zone $binary_remote_addr zone=fs_general:10m rate=20r/s;

server {
    listen 80;
    listen [::]:80;
    server_name __DOMAIN__ www.__DOMAIN__;

    server_tokens off;
    # El panel acepta fotos de hasta 10 MB; el margen cubre el resto del formulario.
    client_max_body_size 11m;

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;

    # Archivos estaticos con nombre hasheado (ManifestStaticFilesStorage): inmutables.
    location /static/ {
        alias /srv/fsconstrucciones/app/staticfiles/;
        gzip_static on;
        expires 30d;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Fotos subidas desde el panel (las sirve nginx directo, no Django).
    location /media/ {
        alias /srv/fsconstrucciones/media/;
        expires 7d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location / {
        limit_req zone=fs_general burst=60 nodelay;
        proxy_pass http://unix:/run/fsconstrucciones/gunicorn.sock;
        proxy_set_header Host $host;
        # Sobrescribe (no agrega) X-Forwarded-For: lo que mande el cliente se descarta.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}
